[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetmusic"
version = "0.1.0"
description = "Transcribe MP3/audio into MuseScore sheet music (.mscz), with vocal-aware melody extraction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[project.optional-dependencies]
separation = ["demucs"]
test = ["pytest"]

[project.scripts]
mp3-to-mscz = "sheetmusic.cli:main"

[tool.setuptools]
packages = ["sheetmusic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
